name: Generate Quran Verse Highlights Data

on:
  workflow_dispatch:
    inputs:
      start_page:
        description: 'Starting page number (1-604)'
        required: true
        default: '1'
      end_page:
        description: 'Ending page number (1-604)'
        required: true
        default: '604'
      threads:
        description: 'Concurrent download threads'
        required: true
        default: '15'
      process_threads:
        description: 'Concurrent processing threads for auto-marker'
        required: true
        default: '4'

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install numpy opencv-python-headless

    - name: Run batch download and marker pipeline
      run: |
        python batch_marker.py \
          --start-page ${{ github.event.inputs.start_page || 1 }} \
          --end-page ${{ github.event.inputs.end_page || 604 }} \
          --threads ${{ github.event.inputs.threads || 15 }} \
          --process-threads ${{ github.event.inputs.process_threads || 4 }}

    - name: Package JSON and WebP outputs
      run: |
        python package_outputs.py

    - name: Upload packaged zip artifact
      uses: actions/upload-artifact@v4
      with:
        name: quran-verse-highlights-data
        path: quran_markers_data.zip
        retention-days: 7
